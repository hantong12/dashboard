<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中南各品类自学习数据看板 (0720-0727)</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0c0e1a 0%, #1a1d35 50%, #0c0e1a 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }
        .dashboard { max-width: 1400px; margin: 0 auto; }
        .header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeInDown 0.8s ease;
        }
        .header h1 {
            font-size: 2.5rem;
            background: linear-gradient(90deg, #00d4ff, #7c3aed, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .header .subtitle { color: #8892b0; font-size: 1.1rem; }

        /* KPI Cards */
        .kpi-cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }
        .kpi-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            animation: fadeInUp 0.8s ease;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .kpi-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        .kpi-card:nth-child(1) { animation-delay: 0.1s; }
        .kpi-card:nth-child(2) { animation-delay: 0.2s; }
        .kpi-card:nth-child(3) { animation-delay: 0.3s; }
        .kpi-value { font-size: 3rem; font-weight: 700; margin-bottom: 5px; }
        .kpi-card:nth-child(1) .kpi-value { color: #00d4ff; }
        .kpi-card:nth-child(2) .kpi-value { color: #7c3aed; }
        .kpi-card:nth-child(3) .kpi-value { color: #f472b6; }
        .kpi-label { font-size: 1rem; color: #8892b0; }
        .kpi-change {
            display: inline-block;
            margin-top: 8px;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .kpi-change.up { background: rgba(74, 222, 128, 0.15); color: #4ade80; }
        .kpi-change.down { background: rgba(248, 113, 113, 0.15); color: #f87171; }

        /* Charts */
        .charts-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 40px;
        }
        .chart-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 25px;
            animation: fadeInUp 1s ease;
        }
        .chart-card h3 {
            font-size: 1.2rem;
            margin-bottom: 20px;
            color: #ccd6f6;
        }

        /* Table */
        .table-container {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 25px;
            overflow-x: auto;
            animation: fadeInUp 1.2s ease;
        }
        .table-container h3 {
            font-size: 1.2rem;
            margin-bottom: 20px;
            color: #ccd6f6;
        }
        table { width: 100%; border-collapse: collapse; }
        th, td {
            padding: 14px 12px;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        th {
            background: rgba(255,255,255,0.05);
            color: #8892b0;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        tr:hover { background: rgba(255,255,255,0.03); }
        .rate-cell { font-weight: 600; }
        .rate-high { color: #4ade80; }
        .rate-mid { color: #fbbf24; }
        .rate-low { color: #f87171; }
        .change-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-left: 6px;
        }
        .change-up { background: rgba(74, 222, 128, 0.15); color: #4ade80; }
        .change-down { background: rgba(248, 113, 113, 0.15); color: #f87171; }
        .change-flat { background: rgba(136, 146, 176, 0.15); color: #8892b0; }
        .week-compare-row td {
            font-size: 0.8rem;
            color: #8892b0;
            padding: 6px 12px;
            border-bottom: 1px dashed rgba(255,255,255,0.08);
        }
        .week-label {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 600;
            margin-right: 6px;
        }
        .week-w1 { background: rgba(129, 140, 248, 0.2); color: #818cf8; }
        .week-w2 { background: rgba(0, 212, 255, 0.2); color: #00d4ff; }

        /* Legend */
        .legend {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            color: #8892b0;
        }
        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 3px;
        }

        /* Animations */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        .pulse { animation: pulse 2s infinite; }

        @media (max-width: 768px) {
            .kpi-cards { grid-template-columns: 1fr; }
            .charts-grid { grid-template-columns: 1fr; }
            .header h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="header">
            <h1>中南各品类自学习数据看板</h1>
            <p class="subtitle">数据周期：2025.07.20 - 2025.07.27（对比：07.13 - 07.20）</p>
        </div>

        <div class="kpi-cards">
            <div class="kpi-card">
                <div class="kpi-value">16,648</div>
                <div class="kpi-label">新增提交数</div>
                <span class="kpi-change up">↑ 8.5% vs 上周</span>
            </div>
            <div class="kpi-card">
                <div class="kpi-value">1,064</div>
                <div class="kpi-label">新增启用数</div>
                <span class="kpi-change up">↑ 69.7% vs 上周</span>
            </div>
            <div class="kpi-card">
                <div class="kpi-value">-779</div>
                <div class="kpi-label">新增回复数</div>
                <span class="kpi-change down">↓ 由正转负</span>
            </div>
        </div>

        <div class="charts-grid">
            <div class="chart-card">
                <h3>各品类新增提交数（周对比）</h3>
                <canvas id="submitChart"></canvas>
            </div>
            <div class="chart-card">
                <h3>各品类启用率（周对比）</h3>
                <canvas id="rateChart"></canvas>
            </div>
        </div>

        <div class="charts-grid">
            <div class="chart-card">
                <h3>品类提交数分布（0720-0727）</h3>
                <canvas id="pieChart"></canvas>
            </div>
            <div class="chart-card">
                <h3>提交率 vs 启用率（周对比）</h3>
                <canvas id="scatterChart"></canvas>
            </div>
        </div>

        <div class="table-container">
            <h3>详细数据表（含周维度对比）</h3>
            <table>
                <thead>
                    <tr>
                        <th>品类</th>
                        <th>提交总数</th>
                        <th>启用数</th>
                        <th>可提交数</th>
                        <th>QA回复数</th>
                        <th>新增提交</th>
                        <th>新增启用</th>
                        <th>提交率</th>
                        <th>启用率</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        // ========== DATA ==========
        const categories = [
            '家具用品', '运动/母婴', '五金工具', '家电', '灯具', '家居收纳',
            'LAZADA', '3C', '宠物用品', '汽摩配', '新加坡', '个护箱包'
        ];

        // Week 1 (0713-0720) data
        const w1 = {
            submitTotal: [21713, 7499, 18348, 2685, 2066, 2116, 447, 1040, 477, 147, 138, 290],
            enabled:     [616,   160,  1625,   10,   100,  397,  148,  14,  136,  47,   1,  14],
            submittable: [47548, 37048, 17185, 5617, 5531, 3724, 6021, 9398, 3954, 3319, 3182, 212],
            qaReply:     [4653,  1824,  5095,  181,  223,  931,   44,   28,  606,  498,   1,   6],
            newSubmit:   [6890,  3193,  1360, 1092, 1040,  620,  363,  166,  122,   50,    2,   2],
            newEnabled:  [527,    18,    18,   27,   20,   30,  114,   10,   55,   18,    0,   0],
            newReply:    [-177,  -418,    -8,   47, -179, -734,   41,  547,  282, -159,   -1,   0],
            submitRate:  [0.7773, 0.8398, 0.8346, 0.8642, 0.8281, 0.8281, 0.5222, 0.7451, 0.8794, 0.7993, 0.7989, 0.6745],
            enableRate:  [0.0400, 0.0166, 0.0344, 0.0098, 0.1492, 0.1492, 0.3607, 0.0361, 0.1969, 0.2189, 0.0071, 0.0483]
        };

        // Week 2 (0720-0727) data
        const w2 = {
            submitTotal: [28603, 10692, 20440, 3777, 3426, 2861, 768, 1359, 970, 297, 141, 290],
            enabled:     [1143,  178,   1832,   37,  118,  427, 277,   49, 191,  65,   1,  14],
            submittable: [36960, 31114, 13944, 4854, 4616, 3084, 3144, 7002, 3477, 2653, 2542, 143],
            qaReply:     [4476,  1406,  4361,  228,  215,  752,   85,  575,  888,  339,    0,   6],
            newSubmit:   [6890,  3193,  2092, 1092, 1360,  745,  321,  319,  493,  150,    3,   0],
            newEnabled:  [527,    18,   207,   27,   18,   30,  129,   35,   55,   18,    0,   0],
            newReply:    [-177,  -418,  -734,   47,   -8, -179,   41,  547,  282, -159,   -1,   0],
            submitRate:  [0.7773, 0.8398, 0.8114, 0.8642, 0.8346, 0.8281, 0.5222, 0.7451, 0.8794, 0.7993, 0.7989, 0.6745],
            enableRate:  [0.0399, 0.0166, 0.0896, 0.0098, 0.0344, 0.1492, 0.3607, 0.0361, 0.1969, 0.2189, 0.0071, 0.0483]
        };

        // Sort by week2 newSubmit descending
        const sortedIndices = [...Array(categories.length).keys()]
            .sort((a, b) => w2.newSubmit[b] - w2.newSubmit[a]);

        const sortedCats = sortedIndices.map(i => categories[i]);
        const s = (arr) => sortedIndices.map(i => arr[i]);

        // Color palette
        const colors = [
            '#00d4ff', '#7c3aed', '#f472b6', '#4ade80', '#fbbf24',
            '#f87171', '#818cf8', '#2dd4bf', '#fb923c', '#a78bfa',
            '#38bdf8', '#e879f9'
        ];

        // ========== SUBMIT CHART (grouped bar) ==========
        new Chart(document.getElementById('submitChart'), {
            type: 'bar',
            data: {
                labels: sortedCats,
                datasets: [
                    {
                        label: '0713-0720',
                        data: s(w1.newSubmit),
                        backgroundColor: 'rgba(129, 140, 248, 0.5)',
                        borderColor: '#818cf8',
                        borderWidth: 2,
                        borderRadius: 6,
                    },
                    {
                        label: '0720-0727',
                        data: s(w2.newSubmit),
                        backgroundColor: 'rgba(0, 212, 255, 0.6)',
                        borderColor: '#00d4ff',
                        borderWidth: 2,
                        borderRadius: 6,
                    }
                ]
            },
            plugins: [ChartDataLabels],
            options: {
                responsive: true,
                plugins: {
                    legend: { labels: { color: '#8892b0', padding: 20 } },
                    datalabels: {
                        anchor: 'end',
                        align: 'top',
                        color: '#e0e0e0',
                        font: { size: 10, weight: 'bold' },
                        formatter: (v) => v >= 100 ? v.toLocaleString() : v,
                    },
                    tooltip: {
                        backgroundColor: 'rgba(0,0,0,0.8)',
                        titleColor: '#fff',
                        bodyColor: '#fff',
                        padding: 12,
                        cornerRadius: 8,
                        callbacks: {
                            afterBody: (ctx) => {
                                const i = ctx[0].dataIndex;
                                const idx = sortedIndices[i];
                                const diff = w2.newSubmit[idx] - w1.newSubmit[idx];
                                const pct = w1.newSubmit[idx] !== 0
                                    ? ((diff / w1.newSubmit[idx]) * 100).toFixed(1)
                                    : 'N/A';
                                return `变化: ${diff >= 0 ? '+' : ''}${diff} (${pct}%)`;
                            }
                        }
                    }
                },
                scales: {
                    x: { ticks: { color: '#8892b0', font: { size: 10 } }, grid: { display: false } },
                    y: { ticks: { color: '#8892b0' }, grid: { color: 'rgba(255,255,255,0.05)' }, beginAtZero: true }
                }
            }
        });

        // ========== RATE CHART (grouped bar) ==========
        new Chart(document.getElementById('rateChart'), {
            type: 'bar',
            data: {
                labels: sortedCats,
                datasets: [
                    {
                        label: '启用率 0713-0720 (%)',
                        data: s(w1.enableRate).map(v => (v * 100).toFixed(2)),
                        backgroundColor: 'rgba(129, 140, 248, 0.5)',
                        borderColor: '#818cf8',
                        borderWidth: 2,
                        borderRadius: 6,
                    },
                    {
                        label: '启用率 0720-0727 (%)',
                        data: s(w2.enableRate).map(v => (v * 100).toFixed(2)),
                        backgroundColor: 'rgba(244, 114, 182, 0.6)',
                        borderColor: '#f472b6',
                        borderWidth: 2,
                        borderRadius: 6,
                    }
                ]
            },
            plugins: [ChartDataLabels],
            options: {
                responsive: true,
                plugins: {
                    legend: { labels: { color: '#8892b0', padding: 20 } },
                    datalabels: {
                        anchor: 'end',
                        align: 'top',
                        color: '#e0e0e0',
                        font: { size: 9, weight: 'bold' },
                        formatter: (v) => v + '%',
                    },
                    tooltip: {
                        backgroundColor: 'rgba(0,0,0,0.8)',
                        padding: 12,
                        cornerRadius: 8,
                    }
                },
                scales: {
                    x: { ticks: { color: '#8892b0', font: { size: 10 } }, grid: { display: false } },
                    y: { ticks: { color: '#8892b0', callback: v => v + '%' }, grid: { color: 'rgba(255,255,255,0.05)' } }
                }
            }
        });

        // ========== PIE CHART ==========
        const pieData = s(w2.newSubmit);
        const totalSubmits = pieData.reduce((a, b) => a + b, 0);
        new Chart(document.getElementById('pieChart'), {
            type: 'doughnut',
            data: {
                labels: sortedCats,
                datasets: [{
                    data: pieData,
                    backgroundColor: colors.map(c => c + 'cc'),
                    borderColor: '#1a1d35',
                    borderWidth: 3,
                    hoverOffset: 20
                }]
            },
            plugins: [ChartDataLabels],
            options: {
                responsive: true,
                cutout: '50%',
                plugins: {
                    legend: {
                        position: 'right',
                        labels: {
                            color: '#ffffff',
                            padding: 10,
                            font: { size: 12 },
                            generateLabels: (chart) => {
                                const data = chart.data;
                                return data.labels.map((label, i) => ({
                                    text: `${label} (${((data.datasets[0].data[i] / totalSubmits) * 100).toFixed(1)}%)`,
                                    fillStyle: data.datasets[0].backgroundColor[i],
                                    strokeStyle: 'transparent',
                                    fontColor: '#ffffff',
                                    index: i
                                }));
                            }
                        }
                    },
                    datalabels: {
                        color: '#ffffff',
                        font: { size: 11, weight: 'bold' },
                        formatter: (value) => {
                            const pct = (value / totalSubmits * 100).toFixed(1);
                            return pct >= 3 ? `${pct}%` : '';
                        },
                        textShadow: true,
                        shadowBlur: 4,
                        shadowColor: 'rgba(0,0,0,0.8)',
                    },
                    tooltip: {
                        backgroundColor: 'rgba(0,0,0,0.8)',
                        padding: 12,
                        cornerRadius: 8,
                        callbacks: {
                            label: (ctx) => {
                                const value = ctx.raw;
                                const pct = (value / totalSubmits * 100).toFixed(1);
                                return ` ${ctx.label}: ${value.toLocaleString()} (${pct}%)`;
                            }
                        }
                    }
                }
            }
        });

        // ========== LINE CHART (submit rate vs enable rate) ==========
        new Chart(document.getElementById('scatterChart'), {
            type: 'line',
            data: {
                labels: sortedCats,
                datasets: [
                    {
                        label: '提交率 0713-0720 (%)',
                        data: s(w1.submitRate).map(v => (v * 100).toFixed(2)),
                        borderColor: 'rgba(129, 140, 248, 0.7)',
                        backgroundColor: 'rgba(129, 140, 248, 0.05)',
                        borderWidth: 2,
                        borderDash: [6, 4],
                        fill: false,
                        tension: 0.4,
                        pointBackgroundColor: '#818cf8',
                        pointBorderColor: '#fff',
                        pointBorderWidth: 2,
                        pointRadius: 5,
                    },
                    {
                        label: '提交率 0720-0727 (%)',
                        data: s(w2.submitRate).map(v => (v * 100).toFixed(2)),
                        borderColor: '#00d4ff',
                        backgroundColor: 'rgba(0, 212, 255, 0.1)',
                        borderWidth: 3,
                        fill: false,
                        tension: 0.4,
                        pointBackgroundColor: '#00d4ff',
                        pointBorderColor: '#fff',
                        pointBorderWidth: 2,
                        pointRadius: 6,
                    },
                    {
                        label: '启用率 0713-0720 (%)',
                        data: s(w1.enableRate).map(v => (v * 100).toFixed(2)),
                        borderColor: 'rgba(251, 191, 36, 0.7)',
                        backgroundColor: 'rgba(251, 191, 36, 0.05)',
                        borderWidth: 2,
                        borderDash: [6, 4],
                        fill: false,
                        tension: 0.4,
                        pointBackgroundColor: '#fbbf24',
                        pointBorderColor: '#fff',
                        pointBorderWidth: 2,
                        pointRadius: 5,
                    },
                    {
                        label: '启用率 0720-0727 (%)',
                        data: s(w2.enableRate).map(v => (v * 100).toFixed(2)),
                        borderColor: '#f472b6',
                        backgroundColor: 'rgba(244, 114, 182, 0.1)',
                        borderWidth: 3,
                        fill: false,
                        tension: 0.4,
                        pointBackgroundColor: '#f472b6',
                        pointBorderColor: '#fff',
                        pointBorderWidth: 2,
                        pointRadius: 6,
                    }
                ]
            },
            options: {
                responsive: true,
                interaction: { mode: 'index', intersect: false },
                plugins: {
                    legend: { labels: { color: '#8892b0', padding: 15, font: { size: 11 } } },
                    tooltip: {
                        backgroundColor: 'rgba(0,0,0,0.85)',
                        padding: 14,
                        cornerRadius: 10,
                    }
                },
                scales: {
                    x: { ticks: { color: '#8892b0', font: { size: 10 } }, grid: { color: 'rgba(255,255,255,0.05)' } },
                    y: {
                        title: { display: true, text: '百分比 (%)', color: '#8892b0' },
                        ticks: { color: '#8892b0' },
                        grid: { color: 'rgba(255,255,255,0.05)' }
                    }
                }
            }
        });

        // ========== TABLE ==========
        const rateClass = (v) => v >= 0.15 ? 'rate-high' : v >= 0.05 ? 'rate-mid' : 'rate-low';
        const changeBadge = (curr, prev) => {
            if (prev === 0 && curr === 0) return '<span class="change-badge change-flat">持平</span>';
            const diff = curr - prev;
            if (diff === 0) return '<span class="change-badge change-flat">持平</span>';
            const isUp = diff > 0;
            return `<span class="change-badge ${isUp ? 'change-up' : 'change-down'}">${isUp ? '↑' : '↓'} ${Math.abs(diff).toLocaleString()}</span>`;
        };
        const rateBadge = (curr, prev) => {
            const diff = (curr - prev) * 100;
            if (Math.abs(diff) < 0.01) return '<span class="change-badge change-flat">持平</span>';
            const isUp = diff > 0;
            return `<span class="change-badge ${isUp ? 'change-up' : 'change-down'}">${isUp ? '↑' : '↓'} ${Math.abs(diff).toFixed(2)}pp</span>`;
        };

        const tbody = document.getElementById('tableBody');
        sortedIndices.forEach((idx, i) => {
            // Main row - week 2 data
            const mainRow = document.createElement('tr');
            mainRow.innerHTML = `
                <td><strong>${categories[idx]}</strong></td>
                <td>${w2.submitTotal[idx].toLocaleString()}${changeBadge(w2.submitTotal[idx], w1.submitTotal[idx])}</td>
                <td>${w2.enabled[idx].toLocaleString()}${changeBadge(w2.enabled[idx], w1.enabled[idx])}</td>
                <td>${w2.submittable[idx].toLocaleString()}${changeBadge(w2.submittable[idx], w1.submittable[idx])}</td>
                <td>${w2.qaReply[idx].toLocaleString()}${changeBadge(w2.qaReply[idx], w1.qaReply[idx])}</td>
                <td>${w2.newSubmit[idx].toLocaleString()}${changeBadge(w2.newSubmit[idx], w1.newSubmit[idx])}</td>
                <td>${w2.newEnabled[idx].toLocaleString()}${changeBadge(w2.newEnabled[idx], w1.newEnabled[idx])}</td>
                <td class="rate-cell ${rateClass(w2.submitRate[idx])}">${(w2.submitRate[idx] * 100).toFixed(2)}%${rateBadge(w2.submitRate[idx], w1.submitRate[idx])}</td>
                <td class="rate-cell ${rateClass(w2.enableRate[idx])}">${(w2.enableRate[idx] * 100).toFixed(2)}%${rateBadge(w2.enableRate[idx], w1.enableRate[idx])}</td>
            `;
            tbody.appendChild(mainRow);

            // Week 1 comparison row
            const compRow = document.createElement('tr');
            compRow.className = 'week-compare-row';
            compRow.innerHTML = `
                <td><span class="week-label week-w1">上周</span></td>
                <td>${w1.submitTotal[idx].toLocaleString()}</td>
                <td>${w1.enabled[idx].toLocaleString()}</td>
                <td>${w1.submittable[idx].toLocaleString()}</td>
                <td>${w1.qaReply[idx].toLocaleString()}</td>
                <td>${w1.newSubmit[idx].toLocaleString()}</td>
                <td>${w1.newEnabled[idx].toLocaleString()}</td>
                <td>${(w1.submitRate[idx] * 100).toFixed(2)}%</td>
                <td>${(w1.enableRate[idx] * 100).toFixed(2)}%</td>
            `;
            tbody.appendChild(compRow);
        });
    </script>
</body>
</html>
